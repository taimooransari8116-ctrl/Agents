<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taimoor's Agent</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    color: #1a1a1a;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    flex-shrink: 0;
  }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f4f4f5;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #1a1a1a;
    padding: 0;
  }
  header .title {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9a9aa2;
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
  .msg {
    max-width: 85%;
    font-size: 15.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #f4f4f5;
    padding: 10px 14px;
    border-radius: 18px;
  }
  .msg.assistant {
    align-self: flex-start;
    color: #1a1a1a;
  }
  .msg strong { font-weight: 700; }
  .msg code {
    background: #f0f0f1;
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.9em;
  }
  .msg.error {
    align-self: stretch;
    background: #fdf1f0;
    border: 1px solid #f3d3d0;
    color: #b3453a;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    padding: 10px 12px;
    border-radius: 10px;
  }
  .msg.pending {
    align-self: flex-start;
    color: #9a9aa2;
    font-style: italic;
  }
  form {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    margin: 0 12px 14px;
    background: #f4f4f5;
    border-radius: 26px;
    flex-shrink: 0;
  }
  input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 16px;
    padding: 8px 6px;
    color: #1a1a1a;
    font-family: inherit;
  }
  input::placeholder { color: #9a9aa2; }
  button.send {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #1a1a1a;
    border: none;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  button.send:disabled { opacity: 0.35; }
  button.send svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="menuBtn" aria-label="Menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>
  <span class="title">Taimoor's Agent</span>
  <button class="icon-btn" id="newBtn" aria-label="New chat">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>
</header>

<div id="log"></div>

<form id="form">
  <input id="input" type="text" placeholder="Kuch bhi pucho…" autocomplete="off" />
  <button type="submit" class="send" id="send" aria-label="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
  </button>
</form>

<script>
  const FUNCTION_URL = "https://kidjcwvlchipzyttekpe.supabase.co/functions/v1/smooth-handler";
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function renderMarkdown(text) {
    let html = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/(?<!\*)\*([^*\n]+?)\*(?!\*)/g, "<em>$1</em>");
    html = html.replace(/`([^`]+?)`/g, "<code>$1</code>");
    html = html.replace(/^#{1,6}\s+(.+)$/gm, "<strong>$1</strong>");
    html = html.replace(/^[*-]\s+(.+)$/gm, "&nbsp;&nbsp;• $1");
    html = html.replace(/\n/g, "<br>");
    return html;
  }

  function addMsg(text, cls) {
    const empty = document.querySelector(".empty-state");
    if (empty) empty.remove();
    const div = document.createElement("div");
    div.className = "msg " + cls;
    if (cls === "assistant") {
      div.innerHTML = renderMarkdown(text);
    } else {
      div.textContent = text;
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  document.getElementById("newBtn").addEventListener("click", () => location.reload());
  document.getElementById("menuBtn").addEventListener("click", () => {
    alert("Purani conversations ki list yahan aayegi — yeh feature abhi ban raha hai.");
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addMsg(message, "user");
    input.value = "";
    sendBtn.disabled = true;
    const pending = addMsg("thinking…", "pending");

    try {
      const res = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ message }),
      });

      const raw = await res.text();
      pending.remove();

      let data;
      try {
        data = JSON.parse(raw);
      } catch {
        addMsg("Response wasn't JSON (status " + res.status + "):\n" + raw, "error");
        sendBtn.disabled = false;
        return;
      }

      if (!res.ok || data.error) {
        addMsg("HTTP " + res.status + "\n" + JSON.stringify(data, null, 2), "error");
      } else {
        addMsg(data.reply ?? JSON.stringify(data, null, 2), "assistant");
      }
    } catch (err) {
      pending.remove();
      addMsg("Network/fetch error:\n" + err.message, "error");
    }

    sendBtn.disabled = false;
    input.focus();
  });

  (async function loadHistory() {
    try {
      const res = await fetch(FUNCTION_URL, { method: "GET" });
      const data = await res.json();
      const hist = data.history ?? [];
      if (hist.length === 0) {
        const div = document.createElement("div");
        div.className = "empty-state";
        div.textContent = "Kuch bhi pucho, shuru karte hain.";
        log.appendChild(div);
      } else {
        hist.forEach((m) => addMsg(m.content, m.role === "user" ? "user" : "assistant"));
      }
    } catch (e) {
      // fine, chat still works fresh
    }
  })();
</script>
</body>
  </html>
