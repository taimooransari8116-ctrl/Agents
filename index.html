<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZORVEX</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    color: #1a1a1a;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    position: relative;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    flex-shrink: 0;
  }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f4f4f5;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #1a1a1a;
    padding: 0;
  }
  header .title {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9a9aa2;
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
  .msg {
    max-width: 85%;
    font-size: 15.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #f4f4f5;
    padding: 10px 14px;
    border-radius: 18px;
  }
  .msg.assistant {
    align-self: flex-start;
    color: #1a1a1a;
  }
  .msg strong { font-weight: 700; }
  .msg code {
    background: #f0f0f1;
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.9em;
  }
  .msg.error {
    align-self: stretch;
    background: #fdf1f0;
    border: 1px solid #f3d3d0;
    color: #b3453a;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    padding: 10px 12px;
    border-radius: 10px;
  }
  .msg.pending {
    align-self: flex-start;
    color: #9a9aa2;
    font-style: italic;
  }
  form {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    margin: 0 12px 14px;
    background: #f4f4f5;
    border-radius: 26px;
    flex-shrink: 0;
  }
  input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 16px;
    padding: 8px 6px;
    color: #1a1a1a;
    font-family: inherit;
  }
  input::placeholder { color: #9a9aa2; }
  button.send {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #1a1a1a;
    border: none;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  button.send:disabled { opacity: 0.35; }
  button.send svg { width: 16px; height: 16px; }

  /* sidebar */
  #sidebar {
    position: fixed;
    inset: 0;
    background: #ffffff;
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar header { border-bottom: 1px solid #eee; }
  .new-chat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 500;
    color: #1a1a1a;
    cursor: pointer;
  }
  .new-chat-row svg { flex-shrink: 0; }
  #convList {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 16px;
  }
  .conv-item {
    padding: 12px 10px;
    border-radius: 10px;
    font-size: 14px;
    color: #333;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conv-item:active { background: #f4f4f5; }
  .conv-item.active { background: #f0f0f1; font-weight: 500; }
  .sidebar-empty {
    padding: 24px 16px;
    color: #9a9aa2;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="menuBtn" aria-label="Menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>
  <span class="title">ZORVEX</span>
  <button class="icon-btn" id="newBtn" aria-label="New chat">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>
</header>

<div id="log"></div>

<form id="form">
  <input id="input" type="text" placeholder="Give ZORVEX a problem to solve.." autocomplete="off" />
  <button type="submit" class="send" id="send" aria-label="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
  </button>
</form>

<div id="sidebar">
  <header>
    <button class="icon-btn" id="closeSidebar" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <span class="title">Chats</span>
    <span style="width:40px"></span>
  </header>
  <div class="new-chat-row" id="sidebarNewChat">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    New chat
  </div>
  <div id="convList"></div>
</div>

<script>
  const FUNCTION_URL = "https://kidjcwvlchipzyttekpe.supabase.co/functions/v1/smooth-handler";
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const sidebar = document.getElementById("sidebar");
  const convList = document.getElementById("convList");

  function getConvId() {
    let id = localStorage.getItem("currentConversationId");
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem("currentConversationId", id);
    }
    return id;
  }
  function setConvId(id) {
    localStorage.setItem("currentConversationId", id);
  }

  function renderMarkdown(text) {
    let html = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/(?<!\*)\*([^*\n]+?)\*(?!\*)/g, "<em>$1</em>");
    html = html.replace(/`([^`]+?)`/g, "<code>$1</code>");
    html = html.replace(/^#{1,6}\s+(.+)$/gm, "<strong>$1</strong>");
    html = html.replace(/^[*-]\s+(.+)$/gm, "&nbsp;&nbsp;• $1");
    html = html.replace(/\n/g, "<br>");
    return html;
  }

  function addMsg(text, cls) {
    const empty = document.querySelector(".empty-state");
    if (empty) empty.remove();
    const div = document.createElement("div");
    div.className = "msg " + cls;
    if (cls === "assistant") {
      div.innerHTML = renderMarkdown(text);
    } else {
      div.textContent = text;
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function showEmptyLog() {
    log.innerHTML = "";
    const div = document.createElement("div");
    div.className = "empty-state";
    div.textContent = "Think deeper. Solve harder.";
    log.appendChild(div);
  }

  async function loadConversation(convId) {
    log.innerHTML = "";
    try {
      const res = await fetch(FUNCTION_URL + "?conversation_id=" + encodeURIComponent(convId));
      const data = await res.json();
      const hist = data.history ?? [];
      if (hist.length === 0) {
        showEmptyLog();
      } else {
        hist.forEach((m) => addMsg(m.content, m.role === "user" ? "user" : "assistant"));
      }
    } catch (e) {
      showEmptyLog();
    }
  }

  async function loadConversationList() {
    convList.innerHTML = '<div class="sidebar-empty">Loading…</div>';
    try {
      const res = await fetch(FUNCTION_URL);
      const data = await res.json();
      const convs = data.conversations ?? [];
      if (convs.length === 0) {
        convList.innerHTML = '<div class="sidebar-empty">No conversations yet.</div>';
        return;
      }
      convList.innerHTML = "";
      const currentId = getConvId();
      convs.forEach((c) => {
        const item = document.createElement("div");
        item.className = "conv-item" + (c.conversation_id === currentId ? " active" : "");
        item.textContent = c.title || "Untitled";
        item.addEventListener("click", () => {
          setConvId(c.conversation_id);
          sidebar.classList.remove("open");
          loadConversation(c.conversation_id === "legacy" ? "legacy" : c.conversation_id);
        });
        convList.appendChild(item);
      });
    } catch (e) {
      convList.innerHTML = '<div class="sidebar-empty">Couldn\'t load the list.</div>';
    }
  }

  document.getElementById("menuBtn").addEventListener("click", () => {
    sidebar.classList.add("open");
    loadConversationList();
  });
  document.getElementById("closeSidebar").addEventListener("click", () => {
    sidebar.classList.remove("open");
  });
  document.getElementById("sidebarNewChat").addEventListener("click", () => {
    const newId = crypto.randomUUID();
    setConvId(newId);
    sidebar.classList.remove("open");
    showEmptyLog();
  });
  document.getElementById("newBtn").addEventListener("click", () => {
    const newId = crypto.randomUUID();
    setConvId(newId);
    showEmptyLog();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addMsg(message, "user");
    input.value = "";
    sendBtn.disabled = true;
    const pending = addMsg("thinking…", "pending");

    try {
      const res = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ message, conversation_id: getConvId() }),
      });

      const raw = await res.text();
      pending.remove();

      let data;
      try {
        data = JSON.parse(raw);
      } catch {
        addMsg("Response wasn't JSON (status " + res.status + "):\n" + raw, "error");
        sendBtn.disabled = false;
        return;
      }

      if (!res.ok || data.error) {
        addMsg("HTTP " + res.status + "\n" + JSON.stringify(data, null, 2), "error");
      } else {
        addMsg(data.reply ?? JSON.stringify(data, null, 2), "assistant");
      }
    } catch (err) {
      pending.remove();
      addMsg("Network/fetch error:\n" + err.message, "error");
    }

    sendBtn.disabled = false;
    input.focus();
  });

  loadConversation(getConvId());
</script>
</body>
</html>
